; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

; `pio run` builds the classic ESP32 only; add `-e esp32-c3-supermini` for the C3
[platformio]
default_envs = esp32-devkitlipo

; Shared by all boards
[env]
; Pinned so the web flasher (GitHub Actions) builds with the same platform as local builds.
; LEDs on the C3 stopped working in web-flasher builds made with 8.0.0; test before bumping.
platform = espressif32@7.1.3
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0

; Classic ESP32 (Olimex ESP32-DevKit-LiPo and most ESP32 dev boards)
[env:esp32-devkitlipo]
board = esp32-devkitlipo

; ESP32-C3 Super Mini. It has no USB chip, so the serial console runs over the
; C3's own USB port (needed for the web flasher's WiFi step and serial commands).
[env:esp32-c3-supermini]
board = esp32-c3-devkitm-1
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
